<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhysioMetrics Lab</title>
  <link rel="stylesheet" href="./src/style/main.css" />
</head>

<body>
  <div class="container" hidden>
    <svg preserveAspectRatio="none"></svg>
    <div class="markers"></div>

    <div class="axis x"></div>
    <div class="axis y"></div>

    <div class="scroll"></div>
    <p class="info"></p>
    <div class="btn">
      <button id="clear">CLEAR SELECTION</button>
      <button id="copy">COPY PLOT</button>
    </div>
  </div>

  <div class="controls hide">
    <div class="start">
      <h1>PHYSIOMETRICS LAB</h1>
    </div>

    <div class="file">
      <span>FILE</span>
      <div>
        <button class="secondary" popovertarget="history-dialog">HISTORY</button>
        <button class="secondary" popovertarget="help-dialog">HELP</button>
      </div>
      <dialog id="history-dialog" popover>
        <p>PREVIOUS FILES:</p>
        <div></div>
        <button popovertarget="history-dialog" popovertargetaction="close">CLOSE</button>
      </dialog>
      <dialog id="help-dialog" popover>
        <p>HELP:</p>
        <div>
          <p>This will a show a help page in the future</p>
        </div>
        <button popovertarget="help-dialog" popovertargetaction="close">CLOSE</button>
      </dialog>
      <label for="file">LOAD FILE</label>
      <input type="file" id="file" accept=".anz">
    </div>

    <div class="start">
      <p><span>V0.0</span>, Department of Physiology and Neurobiology.</p>
      <p>Tárnok Bertalan, 2026 <a href="https://github.com/bt64/physiometrics-lab">SOURCE CODE</a></p>

    </div>

    <div class="opt">
      <span>OPT</span>
      <label for="frame">frame:</label>
      <input type="number" id="frame" min="0" value="0">

      <label for="interpolation">interpolation</label>
      <input type="number" id="interpolation" min="1" max="10" value="4">
      <label for="locextradius">loc.ext radius</label>
      <input type="number" id="locextradius" min="1" max="16" value="2">
    </div>

    <div class="stat">
      <span>STAT</span>
      <button disabled>COPY TABLE</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
